name: verify-poc

# Independent reproduction of the @google/gemini-cli-sdk insecure-default
# PolicyEngine PoC. Runs against a fresh clone of the real, upstream
# google-gemini/gemini-cli repo on GitHub-hosted infrastructure. No source
# file in that repo is modified -- only the new test file is added.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this report repo (for the PoC test file)
        uses: actions/checkout@v4
        with:
          path: report

      - name: Check out target repo at the verified commit
        uses: actions/checkout@v4
        with:
          repository: google-gemini/gemini-cli
          ref: 9c1b0a610534d6f8120964cf2672c07807d8fc90
          path: gemini-cli

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install target repo dependencies
        working-directory: gemini-cli
        run: npm ci --no-audit --no-fund

      - name: Build @google/gemini-cli-core (required for workspace resolution)
        working-directory: gemini-cli
        run: npm run build --workspace @google/gemini-cli-core

      - name: Drop in the PoC test (adds a file, modifies nothing)
        run: |
          cp report/poc/sdk-default-allow.security-repro.test.ts \
             gemini-cli/packages/cli/src/config/extensions/sdk-default-allow.security-repro.test.ts

      - name: Run the PoC
        working-directory: gemini-cli/packages/cli
        run: |
          npx vitest run src/config/extensions/sdk-default-allow.security-repro.test.ts --reporter=verbose \
            2>&1 | tee "$GITHUB_WORKSPACE/poc-result.txt"

      - name: Upload run output as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-verification-result
          path: poc-result.txt
          if-no-files-found: warn
